# pyproject.toml
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openterminal"
dynamic = ["version"]
description = "Natural-language terminal agent over local or SSH shells"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Shells",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "deepagents>=0.7.15",
    "langchain-anthropic>=1.7.2",
    # OpenAI 兼容协议（config [model] provider = "openai"）；agent.py 分支内
    # 惰性导入，但声明为主依赖——onedir/PyPI 安装开箱即用
    "langchain-openai>=1.0",
    "asyncssh>=2.24.0",
    "python-dotenv>=1.0.0",
    "prompt_toolkit>=3.0.0",
    "rich>=13.0.0",
    # 环境设了 SOCKS 代理（ALL_PROXY=socks5://…）时 httpx 构造传输层
    # 需要 socksio，否则模型调用在客户端初始化即 ImportError
    "socksio>=1.0.0",
    # Windows 本地终端走 ConPTY；其它平台不安装
    "pywinpty>=2.2; sys_platform == 'win32'",
    # 记住的连接密码存系统凭据库：Windows 凭据管理器 / macOS Keychain /
    # Linux Secret Service；不可用时自动降级为每次现场输入
    "keyring>=25.0.0",
    # Web 终端：FastAPI + uvicorn
    "fastapi>=0.110",
    "uvicorn>=0.27",
    # 会话 token 消耗估算（网关不回传 usage_metadata 时的兜底口径；
    # 缺失/离线时代码内退化为字符启发式）
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
ot = "openterminal.app:main"
openterminal = "openterminal.app:main"

[tool.setuptools.dynamic]
# 版本单一来源：openterminal/__init__.py（setuptools 经 AST 读取，无需导入重依赖）
version = {attr = "openterminal.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

# 非代码资源需显式声明进包（wheel/sdist 同源）：
# - skills/*/SKILL.md：内置 Agent Skills
# - web frontend：`ot web` 的 index.html + static/（含已提交的 React island
#   构建产物 static/ui/）+ vendor/（xterm）。挂在真包 openterminal.web 上，
#   glob 只覆盖运行时 serve 的三类，绝不含 React 源码目录 frontend/ui/
#   （node_modules/package.json/tsx）——否则 pip 装完 `ot web` 静态资源全 404。
[tool.setuptools.package-data]
"openterminal.skills" = ["*/SKILL.md"]
"openterminal.web" = [
    "frontend/index.html",
    "frontend/static/**/*",
    "frontend/vendor/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = ["ssh: tests requiring a local sshd (deselect with -m 'not ssh')"]
