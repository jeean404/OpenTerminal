<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenTerminal Web</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside id="sidebar">
    <div id="sidebar-head">
      <span class="title">OpenTerminal</span>
      <button id="btn-toggle-sidebar" title="折叠侧栏">«</button>
    </div>
    <div id="sidebar-actions">
      <button id="btn-add-remote" class="side-btn side-btn-primary" title="添加远程终端">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>添加远程</span>
      </button>
      <button id="btn-settings" class="side-btn side-btn-icon" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h0A1.7 1.7 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v0A1.7 1.7 0 0 0 20.91 10H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
    <input id="sidebar-search" type="search" placeholder="搜索主机 / 名称…" autocomplete="off">
    <div id="targets"></div>
  </aside>
  <main id="main">
    <div id="tabbar">
      <button id="btn-show-sidebar" title="展开侧栏" aria-label="展开侧栏" aria-controls="sidebar">☰ 主机</button>
      <div id="tabs"></div>
    </div>
    <div id="panes"></div>
    <section id="settings-view" hidden aria-label="设置">
      <header class="settings-header">
        <div>
          <p class="settings-eyebrow">OPENTERMINAL / PREFERENCES</p>
          <h1>设置</h1>
        </div>
        <button type="button" id="btn-close-settings" class="settings-close">返回终端</button>
      </header>
      <div class="settings-layout">
        <nav class="settings-nav" aria-label="设置分类">
          <button type="button" class="settings-nav-item active" data-settings-section="appearance">外观</button>
          <button type="button" class="settings-nav-item" data-settings-section="models">模型</button>
        </nav>
        <div class="settings-content">
          <section class="settings-section" data-settings-panel="appearance">
            <div class="settings-section-heading">
              <div>
                <h2>外观</h2>
                <p>主题决定界面配色，背景决定整体氛围，两者可以自由搭配。</p>
              </div>
            </div>
            <div class="theme-options" role="radiogroup" aria-label="界面主题">
              <button type="button" class="theme-option" data-theme-choice="dark" role="radio">
                <span class="theme-preview theme-preview-dark"><i></i><i></i><i></i></span>
                <strong>深色</strong><small>经典深色 · 橙色强调</small>
              </button>
              <button type="button" class="theme-option" data-theme-choice="light" role="radio">
                <span class="theme-preview theme-preview-light"><i></i><i></i><i></i></span>
                <strong>浅色</strong><small>明亮清晰 · 适合日间</small>
              </button>
              <button type="button" class="theme-option" data-theme-choice="midnight" role="radio">
                <span class="theme-preview theme-preview-midnight"><i></i><i></i><i></i></span>
                <strong>午夜蓝</strong><small>深蓝背景 · 冷色强调</small>
              </button>
            </div>
            <div class="settings-subsection">
              <div class="settings-subsection-heading">
                <h3>背景</h3>
                <p>点击即用，所有背景在同一处选择；可调透明度与亮度，兼顾氛围和内容清晰度。</p>
              </div>
              <h4 class="wallpaper-group-title">动态 <small>缓慢流动的光影</small></h4>
              <div id="wallpaper-flow" class="wallpaper-options" role="radiogroup" aria-label="动态背景"></div>
              <h4 class="wallpaper-group-title">风景 <small>内置 4K 照片</small></h4>
              <div id="wallpaper-photos" class="wallpaper-gallery" role="radiogroup" aria-label="风景背景"></div>
              <h4 class="wallpaper-group-title">渐变 <small>轻量纯色氛围</small></h4>
              <div id="wallpaper-options" class="wallpaper-options" role="radiogroup" aria-label="渐变背景"></div>
              <h4 class="wallpaper-group-title">我的图片 <small>仅保存在本浏览器，不会上传</small></h4>
              <div class="wallpaper-custom">
                <p id="wallpaper-image-status" class="wallpaper-status" hidden></p>
                <div id="wallpaper-gallery" class="wallpaper-gallery" role="radiogroup" aria-label="自定义图片">
                  <label class="wallpaper-upload" id="wallpaper-upload" for="wallpaper-image-input">
                    <span class="wallpaper-upload-icon" aria-hidden="true">＋</span>
                    <span class="wallpaper-upload-title">上传图片</span>
                    <span class="wallpaper-upload-hint">点击选择或拖拽到此处<br>PNG / JPEG / WebP，≤ 12 MB</span>
                  </label>
                </div>
                <input id="wallpaper-image-input" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
                <p class="wallpaper-error" id="wallpaper-error" role="status" hidden></p>
              </div>
              <h4 class="wallpaper-group-title">显示调节 <small>对所有背景生效</small></h4>
              <div class="wallpaper-custom">
                <div class="wallpaper-controls" style="margin-top:0">
                  <label>显示方式
                    <select id="wallpaper-fit">
                      <option value="cover">铺满</option>
                      <option value="contain">完整显示</option>
                      <option value="repeat">平铺</option>
                      <option value="stretch">拉伸</option>
                    </select>
                  </label>
                  <label>图片位置
                    <select id="wallpaper-position">
                      <option value="center">居中</option>
                      <option value="top">顶部</option>
                      <option value="bottom">底部</option>
                      <option value="left">左侧</option>
                      <option value="right">右侧</option>
                    </select>
                  </label>
                  <label class="wallpaper-range">
                    <span>透明度                     <output id="wallpaper-opacity-value" aria-live="polite">70%</output></span>
                                        <input id="wallpaper-opacity" type="range" min="0" max="100" value="70">
                  </label>
                  <label class="wallpaper-range">
                    <span>亮度 <output id="wallpaper-brightness-value" aria-live="polite">100%</output></span>
                    <input id="wallpaper-brightness" type="range" min="40" max="160" value="100">
                  </label>
                </div>
              </div>
            </div>
          </section>
          <section class="settings-section" data-settings-panel="models" hidden>
            <div class="settings-section-heading">
              <div>
                <h2>模型配置</h2>
                <p>管理模型服务。启用的配置用于新建终端，已打开的终端不会切换。</p>
              </div>
              <button type="button" id="btn-add-model-profile" class="settings-primary">＋ 添加配置</button>
            </div>
            <div id="model-profile-list" class="settings-model-list" aria-live="polite"></div>
          </section>
        </div>
      </div>
    </section>
  </main>
  <div id="modal-root"></div>
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/static/pad_ledger.js"></script>
  <script src="/static/block_stream.js"></script>
  <script src="/static/block_view.js"></script>
  <script src="/static/modal.js"></script>
  <script src="/static/settings.js"></script>
  <script src="/static/model_profiles.js"></script>
  <script src="/static/files_panel.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
