name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Install zsh (hook PTY tests; not in ubuntu runner image)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh
      - name: Run tests
        if: runner.os != 'macOS'
        run: pytest -q
      # macos runner 默认 shell 是 bash 3.2：live 套件 hook 集成起不来
      # （"AI 不可用：shell 不支持集成"）；镜像自带 /bin/zsh，指过去。
      - name: Run tests (macOS runner 默认 shell 是 bash 3.2，切镜像自带的 zsh)
        if: runner.os == 'macOS'
        env:
          SHELL: /bin/zsh
        run: pytest -q

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Static frontend tests
        run: node --test tests/js/*.test.cjs
      - name: React island tests
        working-directory: src/openterminal/web/frontend/ui
        run: |
          npm ci
          npm test
